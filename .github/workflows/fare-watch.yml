name: Fare watch

on:
  schedule:
    # 4 times a day (UTC). 13:17 UTC = 6:17am Mountain in winter. (Tried 2x/day on 11-22;
    # Jack switched back: the ~$3/mo saving wasn't worth it.)
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:      # adds a "Run workflow" button for manual checks
    inputs:
      test_max_stops:
        description: "Test only: max stops to try (leave blank for a normal check). Test runs send no email and don't touch the page."
        required: false
        default: ""
      test_digest:
        description: "Test only: check fresh prices and email the weekly summary to the sending Gmail address only. No other emails; page and history untouched."
        type: boolean
        default: false

concurrency:
  group: fare-watch
  cancel-in-progress: false

permissions:
  contents: read
  pages: write      # publish the lowest-prices page
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40      # the once-a-day big run takes ~8 min, but ~17+ when Ignav is slow (11-22)
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Price history lives in the Actions cache between runs.
      - name: Restore price history
        uses: actions/cache/restore@v6
        with:
          path: data
          key: fares-db-${{ github.run_id }}
          restore-keys: fares-db-

      - name: Check fares
        if: inputs.test_max_stops == '' && !inputs.test_digest
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python watch.py

      - name: Test run (no email, no page)
        if: inputs.test_max_stops != ''
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          MAX_STOPS: ${{ inputs.test_max_stops }}
          DB_PATH: /tmp/test.db
          SITE_DIR: /tmp/site
        run: python watch.py

      - name: Test weekly summary (to SMTP_USER only)
        if: inputs.test_digest
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_DIGEST: "1"
          DB_PATH: /tmp/digest.db
          SITE_DIR: /tmp/site
        run: python watch.py

      - name: Save price history
        if: always() && inputs.test_max_stops == '' && !inputs.test_digest
        uses: actions/cache/save@v6
        with:
          path: data
          key: fares-db-${{ github.run_id }}

      - name: Upload page
        if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub sometimes can't find the just-uploaded page ("No artifacts named github-pages",
      # 11-21 and 11-22). Its error says to retry later, so: try, wait a minute, try once more.
      # The run only fails (and emails) if both tries fail.
      - name: Publish page
        id: deploy
        if: hashFiles('site/index.html') != ''
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying publish
        if: hashFiles('site/index.html') != '' && steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Publish page (retry)
        id: deploy_retry
        if: hashFiles('site/index.html') != '' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
